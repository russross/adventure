[package]
name = "scanline"
version = "0.1.0"
edition = "2024"
default-run = "scanline"

[[bin]]
name = "scanline"
path = "src/main.rs"

[[bin]]
name = "scanline-smoke"
path = "src/tests/sdl_smoke.rs"

[dependencies]
adventure-trace.workspace = true
sdl2.workspace = true

[dev-dependencies]
directport.workspace = true
