[package]
name = "adventure"
version = "0.1.0"
edition = "2024"
default-run = "adventure"

[[bin]]
name = "adventure"
path = "src/main.rs"

[[example]]
name = "sdl_smoke"
path = "src/tests/sdl_smoke.rs"

[dependencies]
adventure-trace.workspace = true
sdl2 = { workspace = true, features = ["unsafe_textures"] }

rawemulator = { path = "rawemulator" }
