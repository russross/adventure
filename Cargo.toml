[package]
name = "adventure"
version = "0.1.0"
edition = "2024"
default-run = "adventure"
autotests = false

[[bin]]
name = "adventure"
path = "src/main.rs"
required-features = ["sdl", "validation"]

[[example]]
name = "sdl_smoke"
path = "src/tests/sdl_smoke.rs"
required-features = ["sdl", "validation"]

[[example]]
name = "adventure_performance"
required-features = ["sdl", "validation"]

[features]
default = ["sdl", "validation"]
sdl = ["dep:sdl2", "dep:crt", "dep:crt-native"]
validation = ["dep:rawemulator"]

[dependencies]
crt = { path = "../crt", optional = true }
crt-native = { path = "../crt/native", optional = true }
adventure-trace.workspace = true
sdl2 = { workspace = true, features = ["unsafe_textures"], optional = true }

rawemulator = { path = "src/rawemulator", optional = true }

[workspace]
members = [".", "src/rawemulator", "src/trace"]
resolver = "3"

[workspace.dependencies]
adventure-trace = { path = "src/trace" }
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["sdl", "validation"]

[[test]]
name = "recording"
path = "tests/recording.rs"

[[test]]
name = "trace"
path = "tests/trace.rs"
required-features = ["validation"]
